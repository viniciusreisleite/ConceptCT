<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural - Concept CT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .tv-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 1.5rem;
      gap: 1.5rem;
      box-sizing: border-box;
      background-color: #0d0d0d;
    }
    .video-section {
      height: 100% !important;
      background: #000 !important;
      border-radius: 24px !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      position: relative !important;
    }
    .tv-container.is-video .video-section {
      flex: 0 0 auto !important;
      aspect-ratio: 9 / 16 !important;
    }
    .tv-container.is-video video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000 !important;
      border-radius: 20px !important;
      display: block !important;
    }
    .tv-container.is-image .video-section {
      flex: 0 0 auto !important;
      width: fit-content !important;
      max-width: 50vw !important;
      background: #000 !important;
    }
    .tv-container.is-image #image-player {
      width: auto !important;
      height: 100% !important;
      max-width: 100% !important;
      object-fit: contain !important;
      border-radius: 20px !important;
      display: block !important;
    }
    .info-section {
      flex: 1 !important;
      height: 100% !important;
      max-height: 100% !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 2.5rem 3rem !important;
      background-color: #141414;
      color: #fff;
      overflow: hidden !important;
      box-sizing: border-box !important;
      border-radius: 24px !important;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .caption-box, #caption-text {
      color: #ffffff !important;
      font-weight: 600 !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8) !important;
      font-size: 2.5vw !important;
      line-height: 1.4 !important;
      white-space: pre-line !important;
    }
  </style>
</head>
<body>
  <div class="tv-container is-image" id="main-container">
    <div class="video-section">
      <img id="image-player" style="display:none;" />
      <video id="player" autoplay playsinline muted loop style="display:none;"></video>
    </div>
    <div class="info-section">
      <div id="caption-text">Carregando informações...</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var mainContainer = document.getElementById('main-container');
      var captionElem = document.getElementById('caption-text');
      var imgElem = document.getElementById('image-player');
      var videoElem = document.getElementById('player');

      fetch('data.json?v=' + Date.now())
        .then(function(res) { return res.json(); })
        .then(function(posts) {
          var post = posts[0];
          captionElem.textContent = post.caption || '';

          if (post.type === 'image') {
            mainContainer.className = 'tv-container is-image';
            videoElem.style.display = 'none';

            imgElem.onload = function() {
              imgElem.style.display = 'block';
            };
            imgElem.onerror = function() {
              setTimeout(function() { imgElem.src = post.media + '?retry=' + Date.now(); }, 3000);
            };
            imgElem.src = post.media;
          }
        });
    });
  </script>
</body>
</html>
